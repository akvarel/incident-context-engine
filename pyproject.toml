[build-system]
requires = ["setuptools>=77", "packaging>=24.2"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-context-engine"
version = "0.7.0"
description = "Loss-aware incident telemetry compression for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE", "LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]
authors = [{name = "OrangeHat"}]

[project.scripts]
incident-context = "incident_context.cli:main"
incident-context-benchmark = "incident_context.runtime_code.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
testpaths = ["tests"]
